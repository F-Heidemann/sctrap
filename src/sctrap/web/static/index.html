<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>sctrap mesh studio</title>
<link rel="stylesheet" href="/static/styles.css">
<!-- Surface JS errors to the page so the user sees them even without devtools. -->
<script>
window.addEventListener("error", e => {
    const s = document.getElementById("status");
    if (s) { s.textContent = "JS error: " + (e.message || e); s.className = "error"; }
    console.error(e);
});
window.addEventListener("unhandledrejection", e => {
    const s = document.getElementById("status");
    if (s) { s.textContent = "JS error: " + (e.reason?.message || e.reason); s.className = "error"; }
    console.error(e);
});
</script>
</head>
<body>
<div id="app">
    <aside id="sidebar">
        <h1>sctrap mesh studio<span class="v">v0.1</span></h1>

        <h2>Trap geometry</h2>
        <div class="field">
            <label>Trap kind</label>
            <select id="trap_kind" disabled>
                <option value="closed_elliptical" selected>Closed elliptical (cavity)</option>
                <option value="open_elliptical" disabled>Open elliptical (next milestone)</option>
            </select>
        </div>
        <div class="field">
            <label>Semi-axis a <span class="unit">[mm]</span></label>
            <div class="row">
                <input type="number" id="a_mm" value="2.25" step="0.1" min="0.1" max="50">
            </div>
        </div>
        <div class="field">
            <label>Semi-axis b <span class="unit">[mm]</span></label>
            <input type="number" id="b_mm" value="1.75" step="0.1" min="0.1" max="50">
        </div>
        <div class="field">
            <label>Height <span class="unit">[mm]</span></label>
            <input type="number" id="height_mm" value="4.7" step="0.1" min="0.1" max="50">
        </div>

        <h2>Mesh resolution</h2>
        <div class="field">
            <label>Bulk tet size <span class="unit">[mm]</span></label>
            <input type="number" id="mesh_size_mm" value="0.5" step="0.05" min="0.02" max="10">
            <div class="hint">smaller = slower, more accurate.</div>
        </div>
        <div class="checkbox-row">
            <input type="checkbox" id="refine_on">
            <label for="refine_on">Refine near SC walls</label>
        </div>
        <div class="field" id="refine_block" style="display:none">
            <label>Tet size at SC walls <span class="unit">[mm]</span></label>
            <input type="number" id="mesh_size_near_mm" value="0.15" step="0.02" min="0.01" max="10">
            <label style="margin-top:6px">Refine distance <span class="unit">[mm]</span></label>
            <input type="number" id="refine_distance_mm" value="0.6" step="0.05" min="0.01" max="50">
        </div>

        <h2>Action</h2>
        <div class="checkbox-row">
            <input type="checkbox" id="auto_update" checked>
            <label for="auto_update">Auto-update on edit</label>
        </div>
        <button class="primary" id="generate_btn">Generate mesh</button>
        <div id="status" class="idle">ready.</div>

        <h2>Stats</h2>
        <div id="stats">
            <div class="row"><span class="label">vertices</span><span id="stat_pts">—</span></div>
            <div class="row"><span class="label">tets</span><span id="stat_tets">—</span></div>
            <div class="row"><span class="label">SC facets</span><span id="stat_sc">—</span></div>
            <div class="row"><span class="label">FF facets</span><span id="stat_ff">—</span></div>
            <div class="row"><span class="label">file size</span><span id="stat_bytes">—</span></div>
            <div class="row"><span class="label">gmsh time</span><span id="stat_time">—</span></div>
        </div>
        <div id="legend"></div>

        <h2>Export</h2>
        <button class="secondary" id="download_btn" disabled>Download .msh</button>
        <button class="secondary" id="snippet_btn" disabled>Copy parameters.py snippet</button>
        <pre class="snippet" id="snippet_text"></pre>
    </aside>

    <section id="viewport">
        <canvas id="canvas"></canvas>
        <div id="viewport-overlay">
            drag = orbit · scroll = zoom · right-drag = pan
        </div>
    </section>
</div>

<script type="module" src="/static/viewer.js"></script>
</body>
</html>
